[project]
name = "simple-calculator"
version = "0.1.0"
description = "Simple calculator example to be used with unit testing"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calculator"]
